help=Controls
help-text=• Drag a block to move it (all selected blocks move together), drag empty space to pan, wheel to zoom; arrow keys move the selected blocks (or pan when nothing is selected).\n• Click a port, then another port to link them. Click a port, then empty space to create a connected node.\n• Shift+click adds to the selection, Ctrl+click on empty space moves the selection there.\n• Right-click a block for its menu, right-click a link to delete it.\n• Double-click a factory to open it. Input/Output nodes inside a factory become its ports.\n• If clicks land off target, press Calibrate.\n• Middle-click a link to add an anchor; drag anchors and link labels with the mouse; Delete or right-click removes an anchor.\n• Colors: green = OK, red = not enough supply, yellow = surplus, grey = not connected.
