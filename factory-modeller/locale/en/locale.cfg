[mod-name]
factory-modeller=Factory Modeller

[mod-description]
factory-modeller=Visual production planner in the spirit of Satisfactory Modeler: build production graphs on a canvas, group parts into factories with inputs and outputs, and see rates, machine counts and power.

[shortcut-name]
fm-shortcut=Factory Modeller

[controls]
fm-middle=Factory Modeller: add anchor (middle mouse)
fm-dbg-press=Factory Modeller: debug left mouse
fm-dbg-release=Factory Modeller: debug right mouse
fm-toggle=Open/close Factory Modeller
fm-wheel-up=Factory Modeller: zoom in
fm-wheel-down=Factory Modeller: zoom out
fm-delete=Factory Modeller: delete selection
fm-pan-left=Factory Modeller: pan left
fm-pan-right=Factory Modeller: pan right
fm-pan-up=Factory Modeller: pan up
fm-pan-down=Factory Modeller: pan down

[mod-setting-name]
fm-camera-ui-scale=Canvas follows UI scale
fm-text-scale=Canvas text size

fm-min-zoom=Canvas: maximum zoom-out

fm-show-top-button=Show button in the top-left corner

[mod-setting-description]
fm-show-top-button=Button that opens Factory Modeller, next to other mod buttons.
fm-min-zoom=How far the canvas can be zoomed out. Too small values make the canvas go black (the game switches to map view).
fm-camera-ui-scale=Turn this off if clicks on the canvas land in the wrong place when your UI scale is not 100%.
fm-text-scale=Size of the text drawn on the canvas.


