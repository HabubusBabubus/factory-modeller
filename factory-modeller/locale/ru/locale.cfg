help=Управление
help-text=• Тащите блок мышью, чтобы переместить (выделенные двигаются вместе); тащите пустое место — сдвиг вида; колесо — масштаб; стрелки двигают выделенные блоки (или вид, если ничего не выделено).\n• Клик по порту, затем по другому порту — связь. Клик по порту, затем по пустому месту — создать связанный узел.\n• Shift+клик — добавить к выделению, Ctrl+клик по пустому месту — перенести выделенное туда.\n• ПКМ по блоку — меню, ПКМ по связи — удалить её.\n• Двойной клик по фабрике — войти в неё. Узлы «Вход»/«Выход» внутри фабрики становятся её портами.\n• Если клики попадают мимо — нажмите «Калибровка».\n• Средняя кнопка мыши на связи — добавить якорь; якоря и подписи связей таскаются мышью; Delete или ПКМ по якорю — удалить его.\n• Цвета: зелёный — всё хорошо, красный — не хватает, жёлтый — излишек, серый — не подключено.
