fm-dbg-release=Factory Modeller: отладка ПКМ
fm-toggle=Открыть/закрыть Factory Modeller
fm-wheel-up=Factory Modeller: приблизить
fm-wheel-down=Factory Modeller: отдалить
fm-delete=Factory Modeller: удалить выделенное
fm-pan-left=Factory Modeller: сдвиг влево
