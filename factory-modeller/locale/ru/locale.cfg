[mod-name]
factory-modeller=Factory Modeller

[mod-description]
factory-modeller=Визуальный планировщик производства в духе Satisfactory Modeler: графы на холсте, объединение частей в фабрики со входами и выходами, расчёт потоков, числа машин и энергии.

[shortcut-name]
fm-shortcut=Factory Modeller

